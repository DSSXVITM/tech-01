name: Nightly retry deploy after KV quota reset

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy if latest run failed
        run: |
          SHA=$(curl -s "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r .sha)
          LAST=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=1" | jq -r .workflow_runs[0].conclusion)
          echo "head_sha=$SHA latest_conclusion=$LAST"
          if [ "$LAST" = "success" ]; then
            echo "Already deployed successfully; nothing to do."
            exit 0
          fi
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Deploy workflow re-dispatched after quota reset."